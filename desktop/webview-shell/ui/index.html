<!doctype html><html lang="zh-CN" data-theme="light" data-density="comfortable"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI 积分网关 · 工作台</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./management.css"><script src="./management.js" defer></script><script src="./app.js" defer></script></head><body>
<div class="app-shell">
  <header class="topbar"><a class="brand" href="#overview" aria-label="AI 积分网关首页"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 22V10a5 5 0 0 1 5-5h12M27 10v12a5 5 0 0 1-5 5H10M10 20l6-9 6 9m-9-4h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>AI 积分网关</strong><span class="brand-tag">工作台</span></a><nav class="workspace-nav" aria-label="工作区"><button data-nav="overview" class="is-active" type="button" aria-current="page">总览</button><button data-nav="accounts" type="button">平台目录</button><button data-nav="routes" type="button">模型路由</button><button data-nav="records" type="button">任务记录</button></nav><div class="topbar-actions"><div class="tools-menu"><button class="button tools-trigger" data-action="tools" type="button" aria-expanded="false" aria-controls="toolsList"><span data-icon="layers"></span><span>管理工具</span></button><div id="toolsList" class="tools-list" role="menu" aria-label="管理工具" hidden><p>完整管理能力</p><button role="menuitem" data-tool-section="accounts" type="button">账号管理<span>添加、登录与账号配置</span></button><button role="menuitem" data-tool-section="routes" type="button">模型路由编辑<span>路由、模型与默认选择</span></button><button role="menuitem" data-tool-section="records" type="button">领取记录<span>核对完整任务回执</span></button><button role="menuitem" data-tool-section="preferences" type="button">业务偏好设置<span>网关与签到调度设置</span></button><button role="menuitem" data-tool-section="diagnostics" type="button">请求诊断<span>检查调用与错误详情</span></button><button role="menuitem" data-tool-section="workbuddy" type="button">WorkBuddy 账号池<span>账号、额度与轮换</span></button><button role="menuitem" data-tool-section="updates" type="button">软件更新<span>检查与管理更新</span></button><button role="menuitem" data-tool-section="operations" type="button">运行中心<span>服务与运行状态</span></button></div></div><button class="command-trigger" data-action="command" aria-label="搜索命令和账号" type="button"><span data-icon="search"></span><span>快速前往</span><kbd>Ctrl K</kbd></button><button class="icon-button" data-action="settings" type="button" aria-label="界面设置"><span data-icon="settings"></span></button><button class="button button-primary" data-action="refresh" type="button"><span data-icon="refresh"></span><span>刷新全部余额</span></button></div></header>
  <div id="modeBanner" class="mode-banner" hidden></div><div id="connectionBanner" class="context-banner" role="status" hidden></div><div id="operationBanner" class="operation-banner" role="status" hidden></div>
  <main id="main" tabindex="-1" aria-busy="true"><div class="loading-state"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-body"></div><p>正在读取本机账本与后台状态…</p></div></main>
  <footer class="workspace-footer"><span><i class="status-dot" id="footerDot"></i><span id="footerService">等待后台连接</span></span><span id="snapshotTime">尚未读取快照</span><div class="footer-controls"><button type="button" data-lifecycle="server.start">启动后台</button><button type="button" data-lifecycle="server.stop">暂停后台</button></div></footer>
</div>
<dialog id="settingsDialog" class="dialog settings-dialog" aria-labelledby="settingsTitle"><form id="settingsForm" method="dialog"><div class="dialog-header"><div><h2 id="settingsTitle">让工作台适合你。</h2><p>只调整这个窗口的阅读与操作习惯。</p></div><button class="icon-button" data-action="close-settings" type="button" aria-label="关闭设置"><span data-icon="close"></span></button></div><div class="settings-body"><div class="setting-row"><div><label for="themeSetting">外观</label><p>清晰的浅色，或安静的深色。</p></div><select id="themeSetting" data-setting="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></div><div class="setting-row"><div><label for="densitySetting">信息密度</label><p>舒适留白，或更紧凑的目录。</p></div><select id="densitySetting" data-setting="density"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></div><div class="setting-row"><div><label for="refreshSetting">自动读取快照</label><p>只读账本与后台状态，不查询上游额度。</p></div><select id="refreshSetting" data-setting="refresh"><option value="0">关闭</option><option value="60">每 60 秒</option><option value="300">每 5 分钟</option></select></div><div class="setting-row"><div><label for="motionSetting">减少动态效果</label><p>保留状态反馈，关闭界面过渡。</p></div><input id="motionSetting" type="checkbox" data-setting="motion"></div><p class="settings-note">界面偏好只保存在新版窗口。账号、模型选择与签到调度请在“管理工具 → 业务偏好设置”中管理。</p></div><div class="dialog-footer"><button class="text-button" data-action="reset-settings" type="button">恢复默认</button><button class="button button-primary" type="submit">保存界面偏好</button></div></form></dialog>
<dialog id="detailsDialog" class="dialog detail-dialog" aria-labelledby="detailsTitle"><div class="dialog-header"><div><h2 id="detailsTitle">任务详情</h2><p id="detailsSubtitle"></p></div><button class="icon-button" data-action="close-details" type="button" aria-label="关闭详情"><span data-icon="close"></span></button></div><div id="detailsContent" class="details-content"></div><div class="dialog-footer"><span>来自当前账本快照</span><button class="button button-primary" data-action="close-details" type="button">完成</button></div></dialog>
<dialog id="commandDialog" class="dialog command-dialog" aria-label="快速前往"><div class="command-search"><span data-icon="search"></span><label class="sr-only" for="commandSearch">搜索账号、工作区或命令</label><input id="commandSearch" placeholder="搜索账号、工作区或命令…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="commandResults"><kbd>Esc</kbd></div><div id="commandResults" class="command-results" role="listbox"></div><div class="command-footer"><span>↑ ↓ 选择 <span>Enter 前往</span></span><span>Ctrl K 随时打开</span></div></dialog>
<dialog id="confirmDialog" class="dialog confirm-dialog" aria-labelledby="confirmTitle"><form id="confirmForm" method="dialog"><div class="dialog-header"><div><h2 id="confirmTitle">确认执行签到</h2><p id="confirmScope"></p></div><button class="icon-button" data-action="cancel-operation" type="button" aria-label="取消签到"><span data-icon="close"></span></button></div><div class="confirm-body"><p id="confirmDescription"></p><p class="confirm-note">后台将核对平台资格与已有领取记录。此次提交不预报奖励；请以任务结果及官方回执为准。</p></div><div class="dialog-footer"><button class="button" data-action="cancel-operation" type="button">取消</button><button id="confirmExecute" class="button button-primary" type="submit">确认提交签到</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
</body></html>
