name: Backend checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Repeated SQLite cold-start contention
        env:
          SQLITE_STRESS_ROUNDS: 25
        run: node --test --test-name-pattern="cold-start" tests/sqlite-concurrency.test.mjs
