name: Backend checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Repeated SQLite cold-start contention
        env:
          SQLITE_STRESS_ROUNDS: 25
        run: node --test --test-name-pattern="cold-start" tests/sqlite-concurrency.test.mjs
      - name: Compile native Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/AiCreditDesktop"
      - name: Verify native WB details with synthetic accounts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/tests/Run-WbDetailsFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/AiCreditDesktopTests"
      - name: Verify WB paging and operation lifecycle with synthetic accounts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/tests/Run-WbPagingFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/WbPagingTests"
          ./desktop/tests/Run-WbOperationToggleFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/WbOperationTests"
      - name: Verify account transfer and rotation UI with synthetic accounts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/tests/Run-WbTransferRotationFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/WbTransferTests"
      - name: Verify diagnostics, preview, activation, daily check-in and paint lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/tests/Run-DiagnosticsFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/DiagnosticsTests"
          ./desktop/tests/Run-WbAuthStateColorFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/WbAuthColorTests"
          ./desktop/tests/Run-WbTaskProgressFixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/WbTaskProgressTests"
